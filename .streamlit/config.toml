[server]
# Порт по умолчанию — меняйте если 8501 занят
port = 8501
# Доступ только с локальной машины. Для сетевого доступа поставьте 0.0.0.0
address = "localhost"
# При изменении .py файлов — перезагрузить автоматически
runOnSave = true
# Максимальный размер загружаемых файлов (МБ)
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#185FA5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F2"
textColor = "#1A1A18"
font = "sans serif"
